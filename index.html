<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List with Calendar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-tasks"></i> Todo List</h1>
            <div class="date-display">
                <span id="current-date"></span>
            </div>
        </header>

        <div class="main-content">
            <div class="calendar-section">
                <div class="calendar-header">
                    <button id="prev-month"><i class="fas fa-chevron-left"></i></button>
                    <h2 id="month-year"></h2>
                    <button id="next-month"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="calendar">
                    <div class="calendar-days">
                        <div>Sun</div>
                        <div>Mon</div>
                        <div>Tue</div>
                        <div>Wed</div>
                        <div>Thu</div>
                        <div>Fri</div>
                        <div>Sat</div>
                    </div>
                    <div id="calendar-grid"></div>
                </div>
            </div>

            <div class="todo-section">
                <div class="todo-header">
                    <h3>Tasks for <span id="selected-date"></span></h3>
                    <button id="add-task-btn" class="add-btn">
                        <i class="fas fa-plus"></i> Add Task
                    </button>
                </div>

                <div class="add-task-form" id="add-task-form" style="display: none;">
                    <input type="text" id="task-input" placeholder="Enter task description...">
                    <div class="form-buttons">
                        <button id="save-task" class="save-btn">Save</button>
                        <button id="cancel-task" class="cancel-btn">Cancel</button>
                    </div>
                </div>

                <div class="todo-list" id="todo-list">
                    <!-- Tasks will be dynamically added here -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
